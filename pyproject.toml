[project]
name = "explain-selection"
version = "0.1.0"
description = "Select text in a macOS terminal, press a hotkey, and have it explained in your running Claude Code session"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2",
  "pydantic-settings>=2",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-timeout",
  "hypothesis",
  "pyright",
  "ruff",
  "import-linter",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/explain_selection"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["src", "tests"]
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"
reportMissingTypeStubs = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# ANN: annotations required (ANN401 forbids Any); T20: no print; PLR: pylint refactor subset
select = ["E", "F", "I", "B", "UP", "ANN", "RUF", "PT", "SIM", "TC", "N", "PLR", "T20"]

[tool.ruff.lint.isort]
known-first-party = ["explain_selection", "tests"]

[tool.ruff.lint.per-file-ignores]
"src/explain_selection/entrypoints/cli.py" = ["T20"]
"tests/**" = ["PLR2004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -x --strict-markers --timeout=5 -m 'not slow and not integration' -p no:cacheprovider"
markers = [
  "slow: takes more than a second or needs external services",
  "integration: talks to a real Claude Code session or real tmux",
  "prop: property-based test",
]
xfail_strict = true
filterwarnings = ["error"]

[tool.importlinter]
root_package = "explain_selection"

[[tool.importlinter.contracts]]
name = "layers"
type = "layers"
layers = [
  "explain_selection.entrypoints",
  "explain_selection.adapters",
  "explain_selection.services",
  "explain_selection.domain",
]
